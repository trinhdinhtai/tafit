[package]
name = "tafit-app"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[features]
default = ["ui-rune"]
# The windowed app, drawn with Rune (ADR-0006). Without it the crate builds
# headless, with no UI framework in the dependency graph (checked in CI).
ui-rune = ["dep:tafit-ui-rune"]

[dependencies]
tafit-base = { workspace = true }
tafit-core = { workspace = true }
tafit-git-gix = { workspace = true }
tafit-state = { workspace = true }
tafit-ui-rune = { workspace = true, optional = true }
