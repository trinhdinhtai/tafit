[workspace]
resolver = "3"
members = ["crates/*"]
default-members = ["crates/tafit"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/trinhdinhtai/tafit"
rust-version = "1.99"

[workspace.dependencies]
# Internal crates
tafit-app = { path = "crates/tafit-app", default-features = false }
tafit-base = { path = "crates/tafit-base" }
tafit-core = { path = "crates/tafit-core" }
tafit-git-gix = { path = "crates/tafit-git-gix" }
tafit-perf = { path = "crates/tafit-perf" }
tafit-state = { path = "crates/tafit-state" }
tafit-text = { path = "crates/tafit-text" }
tafit-ui-gpui = { path = "crates/tafit-ui-gpui" }
tafit-ui-kit = { path = "crates/tafit-ui-kit" }

# External crates
async-channel = "2.5"
# Benchmarks in tafit-perf. Plots and HTML reports are off: the budget report
# reads Criterion's JSON estimates instead.
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }
# Compiles the Windows resource script that gives tafit.exe its icon.
embed-resource = "3.0.12"
# `parallel` makes `ThreadSafeRepository` Send + Sync for the effect workers;
# `status` reads the change list (HEAD vs index vs work tree).
gix = { version = "0.90.0", default-features = false, features = ["sha1", "parallel", "status"] }
gpui = { package = "gpui-ce", git = "https://github.com/Havunen/gpui-ce.git", rev = "4b3b9c54191be9762095dcdf7656d0d3ca30cecf" }
# Editable text (IME, selection, undo) under the ui-kit text area; same
# gpui-ce rev as gpui.
gpui_elements = { package = "gpui_ce_elements", git = "https://github.com/Havunen/gpui-ce.git", rev = "4b3b9c54191be9762095dcdf7656d0d3ca30cecf" }
gpui_platform = { package = "gpui_ce_platform", git = "https://github.com/Havunen/gpui-ce.git", rev = "4b3b9c54191be9762095dcdf7656d0d3ca30cecf" }
# Decodes the window icon; already in the graph through gpui.
image = { version = "0.25.10", default-features = false, features = ["png"] }
# Watches the Active Repository's files: ReadDirectoryChangesW on Windows,
# inotify on Linux, FSEvents on macOS (its default feature).
notify = "8.2.2"
# Signals a git command's process group on cancel (Unix); already in the
# graph through gpui.
rustix = { version = "1.1.6", features = ["process"] }
# Parses Criterion's JSON results in the budget report; already in the graph
# through gpui and criterion.
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# Reads font tables in tests; already in the graph through gpui.
skrifa = "0.49"
# Reads the process's CPU time and resident memory for the idle benchmarks.
sysinfo = { version = "0.40.1", default-features = false, features = ["system"] }
tempfile = "3.27.0"
thiserror = "2.0"

[workspace.lints.rust]
unsafe_code = "forbid"

# Dependencies use the same settings under `cargo build` and `cargo test`, so
# switching between them reuses every artifact.
[profile.dev.package."*"]
opt-level = 1
debug = "line-tables-only"

# Layout, rendering and text shaping run on the UI thread every frame; keep them
# optimized so a debug build still scrolls smoothly.
[profile.dev.package.gpui-ce]
opt-level = 2

[profile.dev.package.gpui_ce_windows]
opt-level = 2

[profile.dev.package.taffy]
opt-level = 2

[profile.dev.package.harfrust]
opt-level = 2

[profile.dev.package.read-fonts]
opt-level = 2

[profile.dev.package.font-types]
opt-level = 2

[profile.release]
lto = "fat"
codegen-units = 1
